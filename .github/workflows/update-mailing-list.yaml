name: Update contributor mailing list

on:
  push:
    branches: [main]
    paths:
      - 'model-metadata/*.yml'
      - 'model-metadata/*.yaml'
      - 'src/update-mailing-list.R'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-mailing-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::yaml

      - name: Regenerate auxiliary-data/mailing-list.txt
        run: Rscript src/update-mailing-list.R

      - name: Commit the list to main if it changed
        run: |
          if git diff --quiet -- auxiliary-data/mailing-list.txt; then
            echo "Mailing list unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auxiliary-data/mailing-list.txt
          git commit -m "Update contributor mailing list"
          git push origin HEAD:main
